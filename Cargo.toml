[package]
name = "rust_scanner"
version = "0.1.4"
edition = "2021"
description = "Proper fast Windows storage scanner in Rust - CLI + Slint UI"

[dependencies]
clap = { version = "3.1.18", features = ["derive"] }
crossbeam-channel = "0.5.4"
crossterm = "0.23.2"
rustc-hash = "1.1.0"
slint = { version = "=1.3.2", default-features = false, features = ["backend-winit", "renderer-winit-software", "compat-1-2"] }
tui = "0.18.0"
windows-sys = { version = "0.36.1", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[build-dependencies]
slint-build = "=1.3.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
